name: Build PWDSV Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "rebrand/pwdsv"]
    paths:
      - "clients/mobile/**"
      - "packages/importer-core/**"
      - "tools/extension/src/lib/**"
      - ".github/workflows/build-android.yml"

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync shared crypto and AI importer modules
        shell: bash
        run: |
          mkdir -p clients/mobile/app/src/main/assets/www/lib/importer
          cp -f tools/extension/src/lib/*.js clients/mobile/app/src/main/assets/www/lib/
          cp -f packages/importer-core/src/*.js clients/mobile/app/src/main/assets/www/lib/importer/

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Release APK
        working-directory: clients/mobile
        run: gradle assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwdsv-android-apk
          path: clients/mobile/app/build/outputs/apk/release/*.apk
