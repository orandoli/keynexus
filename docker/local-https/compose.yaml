services:
  pwdsv:
    image: pwdsv/server:1.37.3
    container_name: pwdsv-pwdsv-https
    restart: unless-stopped
    environment:
      DOMAIN: "https://localhost:8443"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN: "admin123456"
      I_REALLY_WANT_VOLATILE_STORAGE: "true"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "80"
      ROCKET_PROFILE: "release"
      WEB_VAULT_ENABLED: "true"
      WEB_VAULT_FOLDER: "/web-vault"
    volumes:
      - pwdsv_data:/data
      - ../../data/web-vault:/web-vault:ro
      - ../../data/client-releases:/data/client-releases:ro
    expose:
      - "80"

  caddy:
    image: caddy:2
    container_name: pwdsv-caddy-https
    restart: unless-stopped
    depends_on:
      - pwdsv
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../data/client-releases:/srv/client-releases:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pwdsv_data:
    external: true
    name: ${PWDSV_DATA_VOLUME:?Set PWDSV_DATA_VOLUME to the existing PWDSV data volume}
  caddy_data:
  caddy_config:
