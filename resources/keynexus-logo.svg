<svg xmlns="http://www.w3.org/2000/svg" width="380" height="84" viewBox="0 0 380 84" role="img" aria-label="KeyNexus">
  <defs>
    <linearGradient id="kn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2548"/>
      <stop offset="0.55" stop-color="#114d94"/>
      <stop offset="1" stop-color="#0b72b9"/>
    </linearGradient>
    <linearGradient id="kn-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56ccf2"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="kn-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f4ff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="kn-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1565c0"/>
      <stop offset="0.6" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- 徽标底板 -->
  <rect x="4" y="6" width="72" height="72" rx="18" fill="url(#kn-bg)" stroke="url(#kn-ring)" stroke-width="2"/>
  <rect x="9" y="11" width="62" height="62" rx="14" fill="none" stroke="rgba(125,211,252,0.22)" stroke-width="1"/>

  <!-- 盾牌与钥匙孔 -->
  <path d="M40 18 L60 22.5 L60 40.5 C60 51.5 51.2 60.5 40 65 C28.8 60.5 20 51.5 20 40.5 L20 22.5 Z" fill="url(#kn-shield)"/>
  <circle cx="40" cy="36.5" r="6.2" fill="#0b3b73"/>
  <path d="M37.1 40.5 L42.9 40.5 L44.8 53 L35.2 53 Z" fill="#0b3b73"/>

  <!-- 品牌字标 -->
  <text x="92" y="55"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="800" letter-spacing="0.5"
        fill="url(#kn-word)">KeyNexus</text>
</svg>
