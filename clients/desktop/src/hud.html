<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyNexus HUD</title>
    <link rel="stylesheet" href="hud.css" />
  </head>
  <body>
    <div class="hud-card" id="hud-card">
      <div class="hud-accent-line"></div>
      <header class="hud-head">
        <div class="hud-brand">
          <span class="pulse-dot"></span>
          <b>KeyNexus</b>
          <span class="exe-tag" id="hud-exe">app.exe</span>
        </div>
        <button type="button" class="close-btn" id="btn-hud-close" title="关闭">×</button>
      </header>

      <div id="hud-matched" class="hud-body">
        <div class="account-row">
          <select id="hud-select" class="account-select"></select>
          <span class="totp-pill" id="hud-totp" hidden title="点击复制 Authenticator 动态码"></span>
        </div>
        <div class="user-hint" id="hud-user-hint"></div>
        <div class="hud-actions">
          <button type="button" class="primary" id="btn-hud-type-pwd">⌨ 键入密码</button>
          <button type="button" class="ghost" id="btn-hud-type-both" title="依次键入 账号 -> Tab -> 密码">账号+密码</button>
          <button type="button" class="ghost" id="btn-hud-copy">复制</button>
          <button type="button" class="muted-btn" id="btn-hud-mute" title="本次进程关闭前不再自动弹出">静默</button>
        </div>
      </div>

      <div id="hud-unmatched" class="hud-body" hidden>
        <p class="unmatched-text" id="hud-unmatched-text">当前程序尚未绑定密码记录</p>
        <div class="hud-actions">
          <button type="button" class="primary" id="btn-hud-add-app">＋ 为此程序提交密码</button>
          <button type="button" class="ghost" id="btn-hud-dismiss">稍后</button>
        </div>
      </div>

      <div class="progress-track"><div class="progress-bar" id="hud-progress"></div></div>
    </div>
    <script src="hud.js" type="module"></script>
  </body>
</html>
