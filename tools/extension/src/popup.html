<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyNexus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="icons/128.png" alt="KeyNexus" class="brand-img" />
        </span>
        <div class="brand-titles">
          <b>KeyNexus</b>
          <small id="top-domain-pill">零知识密码中枢</small>
        </div>
      </div>
      <div class="top-actions">
        <button id="btn-new" class="icon-btn accent" title="手动提交新密码" hidden>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14" /><path d="M5 12h14" />
          </svg>
          <span>记密码</span>
        </button>
        <button id="btn-sync" class="icon-btn svg-ic" title="立即与服务器同步" hidden>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" />
          </svg>
        </button>
        <button id="btn-lock" class="icon-btn svg-ic" title="立即锁定密码库" hidden>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </button>
        <button id="btn-theme" class="icon-btn svg-ic" title="切换浅色 / 深色主题" aria-label="切换主题">
          <svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" />
            <path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" />
            <path d="M2 12h2" /><path d="M20 12h2" />
            <path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" />
          </svg>
          <svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn svg-ic" title="插件设置">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main">
      <!-- 1. 未解锁视图 -->
      <section id="locked-view" class="view" hidden>
        <div class="unlock-hero">
          <div class="unlock-badge">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
              <path d="m9 12 2 2 4-4" />
            </svg>
            <span>端到端零知识加密</span>
          </div>
          <p class="hint" id="locked-hint">连接你的 PWDSV 服务器，输入主密码在本机派生密钥解锁。</p>
        </div>
        <form id="unlock-form" class="card-box" autocomplete="off">
          <label class="field">
            <span>PWDSV 服务器地址</span>
            <input id="server" type="url" placeholder="https://vault.example.com" spellcheck="false" />
          </label>
          <label class="field">
            <span>账号邮箱</span>
            <input id="email" type="email" placeholder="you@example.com" spellcheck="false" />
          </label>
          <label class="field">
            <span>主密码</span>
            <input id="password" type="password" placeholder="仅在本机内存派生密钥" />
          </label>
          <div id="twofactor-field" class="twofactor-box" hidden>
            <label class="field">
              <span>两步验证方式</span>
              <select id="twofactor-provider"></select>
            </label>
            <label class="field">
              <span>两步验证码</span>
              <div class="inline-row">
                <input id="twofactor" type="text" inputmode="numeric" placeholder="6 位动态码或恢复码" />
                <button type="button" id="btn-send-email-otp" class="ghost small" hidden>发邮件码</button>
              </div>
            </label>
          </div>
          <label class="check-inline">
            <input id="keep-signed-in" type="checkbox" checked />
            <span>保持登录状态（重启浏览器免重新登录）</span>
          </label>
          <button type="submit" class="primary" id="btn-unlock">解锁密码库</button>
          <p class="error" id="unlock-error" hidden></p>
        </form>
      </section>

      <!-- 2. 密码库列表视图（悬停支持一键填入当前网页 / 一键复制） -->
      <section id="vault-view" class="view" hidden>
        <div class="sticky-head">
          <div class="search">
            <svg class="ic search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
            </svg>
            <input id="search" type="search" placeholder="搜全库：名称、账号、域名、.exe…" spellcheck="false" />
          </div>
          <div class="tabs" role="tablist">
            <button type="button" class="tab active" data-scope="site" id="tab-site">当前站 (0)</button>
            <button type="button" class="tab" data-scope="universal" id="tab-uni">通用</button>
            <button type="button" class="tab" data-scope="apps" id="tab-apps">电脑</button>
            <button type="button" class="tab" data-scope="mobile" id="tab-mob">手机</button>
            <button type="button" class="tab" data-scope="all" id="tab-all">全部 (0)</button>
          </div>
        </div>

        <div id="site-hint" class="site-hint" hidden></div>
        <ul id="item-list" class="item-list"></ul>

        <div id="list-empty" class="empty-state" hidden>
          <div class="empty-ic" aria-hidden="true">
            <svg class="ic ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
            </svg>
          </div>
          <p class="hint" id="empty-text">没有匹配的密码记录</p>
          <button type="button" id="btn-empty-new" class="ghost small">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14" /><path d="M5 12h14" />
            </svg>
            <span>为当前页面添加一条密码</span>
          </button>
        </div>

        <div class="gen-card">
          <div class="gen-bar">
            <span class="gen-title">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect width="12" height="12" x="2" y="10" rx="2" ry="2" />
                <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" />
                <path d="M6 18h.01" /><path d="M10 14h.01" /><path d="M15 6h.01" /><path d="M18 9h.01" />
              </svg>
              <span>随手生成强密码</span>
            </span>
            <div class="inline-row">
              <button type="button" id="btn-generate" class="ghost small">生成 20 位</button>
              <button type="button" id="btn-gen-copy" class="ghost small" hidden>复制</button>
            </div>
          </div>
          <div id="gen-result" class="gen-result" hidden>
            <code id="gen-value"></code>
          </div>
        </div>
      </section>

      <!-- 3. 条目详情视图 -->
      <section id="detail-view" class="view" hidden>
        <div class="subbar">
          <button type="button" id="btn-back" class="ghost small">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
            </svg>
            <span>返回列表</span>
          </button>
          <div class="subbar-actions">
            <button type="button" id="btn-edit" class="ghost small">
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
                <path d="m15 5 4 4" />
              </svg>
              <span>编辑</span>
            </button>
            <button type="button" id="btn-delete" class="ghost small danger-text">删除</button>
          </div>
        </div>

        <div class="detail-hero">
          <div class="p-avatar lg" id="detail-avatar">PW</div>
          <div class="detail-hero-main">
            <div class="detail-title-line">
              <h2 id="detail-name"></h2>
              <button type="button" id="btn-detail-fav" class="fav-star" title="收藏 / 取消收藏" aria-label="收藏 / 取消收藏">
                <svg class="ic ic-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg>
              </button>
            </div>
            <div id="detail-badges" class="badges-row"></div>
          </div>
        </div>

        <div class="detail-cta-strip">
          <button type="button" id="btn-fill" class="primary">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
            </svg>
            <span>一键填入当前网页</span>
          </button>
        </div>

        <div class="card-box compact-rows">
          <div class="detail-row">
            <div class="dr-meta">
              <span class="label">账号 / 用户名</span>
              <code id="detail-username"></code>
            </div>
            <button type="button" class="ghost small" data-copy="username">复制</button>
          </div>

          <div class="detail-row">
            <div class="dr-meta">
              <div class="lbl-with-pill">
                <span class="label">登录密码</span>
                <span id="detail-strength" class="strength-pill" hidden></span>
              </div>
              <div id="detail-password" class="pwd-val masked">••••••••••••</div>
            </div>
            <div class="inline-row">
              <button type="button" class="ghost small" id="btn-reveal">显示</button>
              <button type="button" class="ghost small" data-copy="password">复制</button>
            </div>
          </div>

          <div class="detail-row" id="detail-totp-row" hidden>
            <div class="dr-meta">
              <span class="label">Authenticator 动态码</span>
              <div class="totp-inline">
                <code id="detail-totp"></code>
                <span class="totp-ring-box">
                  <svg class="totp-svg" viewBox="0 0 24 24" width="16" height="16">
                    <circle class="r-bg" cx="12" cy="12" r="9" />
                    <circle class="r-fg" id="detail-totp-circle" cx="12" cy="12" r="9" stroke-dasharray="56.55" stroke-dashoffset="0" />
                  </svg>
                  <span id="totp-left" class="totp-left"></span>
                </span>
              </div>
            </div>
            <button type="button" class="ghost small" data-copy="totp">复制</button>
          </div>
        </div>

        <div class="card-box" id="detail-uri-row" style="margin-top: 8px" hidden>
          <span class="sec-lbl">关联终端与自动触发规则</span>
          <div id="detail-uris" class="uri-list"></div>
        </div>

        <div class="card-box" id="detail-notes-row" style="margin-top: 8px" hidden>
          <span class="sec-lbl">安全备注</span>
          <div id="detail-notes" class="notes-box"></div>
        </div>
      </section>

      <!-- 4. 新建 / 编辑密码表单视图 -->
      <section id="editor-view" class="view" hidden>
        <div class="subbar">
          <button type="button" id="btn-editor-cancel" class="ghost small">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7" /><path d="M19 12H5" />
            </svg>
            <span>取消</span>
          </button>
          <span id="editor-title" class="subbar-title">新建密码</span>
        </div>

        <form id="editor-form" class="card-box" autocomplete="off">
          <label class="field">
            <span>条目名称 *</span>
            <input id="ed-name" type="text" placeholder="例如：GitHub / 公司邮箱 / Navicat" required />
          </label>
          <label class="field">
            <span>适用端口类型（服务端四态分类）</span>
            <select id="ed-scope">
              <option value="universal">三端统一通用账户（网页 + 电脑 + 手机互通）</option>
              <option value="web">仅网页端密码</option>
              <option value="desktop">仅电脑客户端密码</option>
              <option value="mobile">仅手机端密码</option>
            </select>
          </label>
          <label class="field">
            <span>账号 / 用户名</span>
            <input id="ed-username" type="text" placeholder="邮箱、手机号或登录名" spellcheck="false" />
          </label>
          <div class="field">
            <div class="lbl-with-pill" style="margin-bottom: 4px">
              <span style="margin: 0">密码 *</span>
              <span id="ed-strength" class="strength-pill" hidden></span>
            </div>
            <div class="inline-row">
              <input id="ed-password" type="password" placeholder="输入或点右侧生成强密码" required />
              <button type="button" id="btn-ed-eye" class="ghost small">显示</button>
              <button type="button" id="btn-ed-gen" class="ghost small svg-btn" title="生成 20 位高强度密码" aria-label="生成 20 位高强度密码">
                <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect width="12" height="12" x="2" y="10" rx="2" ry="2" />
                  <path d="m17.92 14 3.5-3.5a2.24 2.24 0 0 0 0-3l-5-4.92a2.24 2.24 0 0 0-3 0L10 6" />
                  <path d="M6 18h.01" /><path d="M10 14h.01" /><path d="M15 6h.01" /><path d="M18 9h.01" />
                </svg>
              </button>
            </div>
          </div>
          <label class="field">
            <span>匹配网址或应用（每行一条：网址 / app://进程.exe / androidapp://包名）</span>
            <textarea id="ed-uris" rows="2" placeholder="https://example.com&#10;app://WeChat.exe" spellcheck="false"></textarea>
          </label>
          <label class="field">
            <span>Authenticator 密钥（选填，Base32 或 otpauth://）</span>
            <input id="ed-totp" type="text" placeholder="JBSWY3DPEHPK3PXP" spellcheck="false" />
          </label>
          <div class="inline-two">
            <label class="field">
              <span>文件夹</span>
              <select id="ed-folder">
                <option value="">无文件夹</option>
              </select>
            </label>
            <label class="check-inline">
              <input id="ed-favorite" type="checkbox" />
              <span>星标收藏</span>
            </label>
          </div>
          <label class="field">
            <span>备注（选填）</span>
            <textarea id="ed-notes" rows="2" placeholder="安全问题、附加说明等"></textarea>
          </label>

          <button type="submit" class="primary" id="btn-ed-save">加密提交到服务器</button>
          <p class="error" id="editor-error" hidden></p>
        </form>
      </section>
    </main>

    <footer class="statusbar">
      <span id="status-text">未解锁</span>
      <button type="button" id="btn-popup-update" class="update-pill" hidden></button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
